name: build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 빌드 · 단위 테스트
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: 빌드
        run: dotnet build SoundVisualizer.slnx -c Release
      - name: 단위 테스트
        run: dotnet test SoundVisualizer.Tests/SoundVisualizer.Tests.csproj -c Release --no-build
